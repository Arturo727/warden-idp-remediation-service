version: "3.9"

services:
  warden:
    build: .
    container_name: warden
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mock-orchestrator
      - mock-notifier

  mock-orchestrator:
    image: python:3.12-slim
    container_name: mock-orchestrator
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install fastapi uvicorn && uvicorn mocks.mock_orchestrator:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"

  mock-notifier:
    image: python:3.12-slim
    container_name: mock-notifier
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install fastapi uvicorn && uvicorn mocks.mock_notifier:app --host 0.0.0.0 --port 8002"
    ports:
      - "8002:8002"
